<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFOne - WSE</title>
    <link rel="stylesheet" href="styles.css" />

    <script>
      window.addEventListener("error", function (e) {
        if (document.body) {
          document.body.innerHTML =
            '<div style="background:#dc2626; color:white; padding:30px; box-sizing:border-box; width:100%; min-height:100vh; font-family:sans-serif; position:absolute; top:0; left:0; z-index:99999;"><h2>Erro Fatal no JS:</h2><p>' +
            e.message +
            "</p><p><strong>Arquivo:</strong> " +
            e.filename +
            ":" +
            e.lineno +
            "</p></div>";
        } else {
          console.error("Erro Crítico:", e.message);
        }
      });
      window.addEventListener("unhandledrejection", function (e) {
        if (document.body) {
          document.body.innerHTML =
            '<div style="background:#ea580c; color:white; padding:30px; box-sizing:border-box; width:100%; min-height:100vh; font-family:sans-serif; position:absolute; top:0; left:0; z-index:99999;"><h2>Erro de Execução:</h2><p>' +
            (e.reason && e.reason.message ? e.reason.message : e.reason) +
            "</p></div>";
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo-container">
        <h1
          style="
            color: var(--text-primary);
            font-size: 24px;
            letter-spacing: 2px;
          "
        >
          NF<span style="color: var(--accent-green)">ONE</span>
        </h1>
        <p
          style="color: var(--text-secondary); font-size: 11px; margin-top: 5px"
        >
          Gestão Operacional
        </p>
      </div>

      <nav class="menu">
        <button class="menu-item active" id="btn-dashboard">Dashboard</button>
        <button class="menu-item" id="btn-faturamento">Faturamento</button>
        <button class="menu-item" id="btn-catalogo">Catálogo Técnico</button>
        <button class="menu-item" id="btn-logistica">Ordem de Serviço</button>
        <button class="menu-item" id="btn-agenda">Agenda Corporativa</button>
        <button class="menu-item" id="btn-orcamentos">Orçamentos e Laudos</button> </nav>
      </nav>

      <button class="logout-btn">Sair</button>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div style="color: var(--text-secondary)">
          Módulo:
          <span
            id="titulo-modulo"
            style="color: var(--text-primary); font-weight: bold"
            >Dashboard</span
          >
        </div>
        <div id="nome-usuario-header" style="font-weight: bold"></div>
      </header>

      <div id="app-container"></div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
